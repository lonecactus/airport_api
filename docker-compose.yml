services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Mount the application code and the custom config
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - app-network

  php-fpm:
    #image: php:8.3-fpm-alpine # Use an appropriate PHP version
    build: ./php-fpm
    volumes:
      # Mount the application code
      - ./www:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      # Maps host port 3306 to container port 3306
      - "3306:3306"
    volumes:
      # Persist database data and run init script if available
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge